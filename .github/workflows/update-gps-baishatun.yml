name: Update GPS Position Baishatun

on:
  schedule:
    # Every 5 minutes. GAS `cronPush` is movement-gated; the workflow also
    # gates on position fields, so no-op runs produce no commit.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Serialise runs of THIS workflow. Note: `concurrency` is per-workflow, so
# it does NOT protect against another workflow pushing to the same repo.
# The "Fetch" + "Commit and push" steps below are written to tolerate that.
concurrency:
  group: mazu-gps-baishatun
  cancel-in-progress: false

jobs:
  update-gps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Mazu position from GAS
        id: fetch
        env:
          WEB_APP_SECRET: ${{ secrets.WEB_APP_SECRET }}
        run: |
          set -euo pipefail

          # Baishatun-only GAS deployment.
          # action=cronPush → buildPositionResponse_(includeFlag=true) + updateGitHubCache_
          URL="https://script.google.com/macros/s/AKfycbxJAlXwKv8tUgc9DQEpSDxPSLHI0Gl8deFqiDgbCoYHzz-xIKDAd8g0n8G5pGMErrq9pg/exec?action=cronPush&key=${WEB_APP_SECRET}"

          for i in 1 2 3; do
            echo "Attempt $i..."
            HTTP_CODE=$(curl -sSL --max-time 20 -o /tmp/resp.json -w '%{http_code}' "$URL" || echo "000")
            echo "HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] && head -c 1 /tmp/resp.json | grep -q '{'; then
              break
            fi
            sleep $((i * 5))
          done

          if [ ! -s /tmp/resp.json ]; then
            echo "::error::Empty response from GAS"
            exit 1
          fi
          if grep -qi '<html' /tmp/resp.json; then
            echo "::error::GAS returned HTML (deployment access misconfigured?)"
            exit 1
          fi
          if ! jq -e . /tmp/resp.json > /dev/null 2>&1; then
            echo "::error::Response is not valid JSON"
            head -c 500 /tmp/resp.json
            exit 1
          fi

          STATUS=$(jq -r '.status // "unknown"' /tmp/resp.json)
          if [ "$STATUS" = "forbidden" ]; then
            echo "::error::GAS rejected the request (missing/wrong WEB_APP_SECRET?)"
            exit 1
          fi
          if [ "$STATUS" != "success" ]; then
            echo "::error::Unexpected status: $STATUS"
            cat /tmp/resp.json
            exit 1
          fi

          mkdir -p web/data
          mv /tmp/resp.json web/data/position-baishatun.json
          echo "Fetched OK: status=$STATUS"

      - name: Commit and push
        run: |
          set -euo pipefail

          # ---- Fix 2: compare only position-relevant fields ----
          # Fields that MUST advance on movement: mazu.lat/lng, flag.lat/lng,
          # mazu.source. We strip everything that changes every tick
          # (updateTime, parkedSince, github, the whole `sources` block, and
          # the per-element timestamps), so the comparison only fires on
          # real position changes.
          jq '{
            status,
            mazu: (if .mazu then {lat: .mazu.lat, lng: .mazu.lng, source: .mazu.source} else null end),
            leadingFlag: (if .leadingFlag then {lat: .leadingFlag.lat, lng: .leadingFlag.lng} else null end),
            flag: (if .flag then {lat: .flag.lat, lng: .flag.lng} else null end)
          }' web/data/position-baishatun.json > /tmp/pos-signature.json

          # ---- Fix 2: the committed file keeps the FULL payload ----
          # (frontend needs parkedSince, updateTime, flag/leadingFlag, etc.)
          jq 'del(.github)' web/data/position-baishatun.json > /tmp/position-committed.json

          NEW_SIG=$(sha256sum /tmp/pos-signature.json | awk '{print $1}')
          OLD_SIG=""
          if [ -f web/data/.pos-signature-baishatun.json ]; then
            OLD_SIG=$(sha256sum web/data/.pos-signature-baishatun.json | awk '{print $1}')
          fi

          if [ "$NEW_SIG" = "$OLD_SIG" ]; then
            echo "Position unchanged (signature $NEW_SIG); skipping commit."
            exit 0
          fi

          # ---- Fix 1: write files, then loop fetch/reset/commit/push ----
          # Save the freshly built canonical files somewhere safe so the
          # reset in the loop doesn't destroy them.
          cp /tmp/position-committed.json /tmp/keep-position.json
          cp /tmp/pos-signature.json     /tmp/keep-signature.json

          for attempt in 1 2 3; do
            echo "===== Push attempt $attempt ====="

            # Always rebuild from remote HEAD so a previous run's commit
            # cannot collide with ours.
            git fetch origin main
            git reset --hard origin/main

            # Restore the payload we just fetched.
            cp /tmp/keep-position.json  web/data/position-baishatun.json
            cp /tmp/keep-signature.json web/data/.pos-signature-baishatun.json

            # Stage + commit.
            git add web/data/position-baishatun.json web/data/.pos-signature-baishatun.json
            if git diff --cached --quiet; then
              echo "Nothing to commit after reset (remote already has our state)."
              exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update GPS position [skip ci]"

            if git push origin main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi

            echo "Push rejected; will rebuild from remote HEAD and retry."
            sleep $((attempt * 3))
          done

          echo "::error::Push failed after 3 attempts"
          exit 1
