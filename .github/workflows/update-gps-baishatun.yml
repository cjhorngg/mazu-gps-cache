name: Update GPS Position Unified Baishatun

on:
  schedule:
    # Every 5 minutes. GitHub Actions free tier minimum is 5 min;
    # the GAS writer self-throttles to one commit per GITHUB_WRITE_INTERVAL_MS
    # (default 30 s floor) and movement-gated, so 5 min is safe.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mazu-gps-baishatun
  cancel-in-progress: false

jobs:
  update-gps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Mazu position from GAS
        id: fetch
        env:
          WEB_APP_SECRET: ${{ secrets.WEB_APP_SECRET }}
        run: |
          set -euo pipefail

          # Baishatun-only GAS deployment.
          # action=cronPush → buildPositionResponse_(includeFlag=true) + updateGitHubCache_
          # The GAS writer is movement-gated, so repeated identical positions
          # return {"status":"skipped"} — the commit step below sees "no change"
          # and exits cleanly. Only real movement produces a new commit.
          URL="https://script.google.com/macros/s/AKfycbyUkj6Y8_tQS9N9Tjjd2etrCHTT17gH4qjxJJEUbZudPzcBBKeuTsH-BoIZJekBtFXcDQ/exec?action=cronPush&key=${WEB_APP_SECRET}"

          for i in 1 2 3; do
            echo "Attempt $i..."
            HTTP_CODE=$(curl -sSL --max-time 20 -o /tmp/resp.json -w '%{http_code}' "$URL" || echo "000")
            echo "HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] && head -c 1 /tmp/resp.json | grep -q '{'; then
              break
            fi
            sleep $((i * 5))
          done

          if [ ! -s /tmp/resp.json ]; then
            echo "::error::Empty response from GAS"
            exit 1
          fi
          if grep -qi '<html' /tmp/resp.json; then
            echo "::error::GAS returned HTML (deployment access misconfigured?)"
            exit 1
          fi
          if ! jq -e . /tmp/resp.json > /dev/null 2>&1; then
            echo "::error::Response is not valid JSON"
            head -c 500 /tmp/resp.json
            exit 1
          fi

          STATUS=$(jq -r '.status // "unknown"' /tmp/resp.json)
          if [ "$STATUS" = "forbidden" ]; then
            echo "::error::GAS rejected the request (missing/wrong WEB_APP_SECRET?)"
            exit 1
          fi
          if [ "$STATUS" != "success" ]; then
            echo "::error::Unexpected status: $STATUS"
            cat /tmp/resp.json
            exit 1
          fi

          mkdir -p web/data
          mv /tmp/resp.json web/data/position-baishatun.json
          echo "Fetched OK: status=$STATUS"

      - name: Commit and push
        run: |
          set -euo pipefail

          # Strip volatile fields (updateTime, github sub-object) so that
          # the canonical diff only reflects real state changes.
          # NOTE: parkedSince is NOT stripped — it is part of the payload
          # and must be preserved so the frontend can distinguish "parked"
          # from "dead writer".
          jq 'del(.updateTime, .github)' web/data/position-baishatun.json > /tmp/canonical.json

          if [ -f web/data/.canonical-baishatun.json ] && cmp -s /tmp/canonical.json web/data/.canonical-baishatun.json; then
            echo "No meaningful change"
            exit 0
          fi
          cp /tmp/canonical.json web/data/.canonical-baishatun.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/position-baishatun.json web/data/.canonical-baishatun.json
          git commit -m "Update GPS position [skip ci]"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt..."
            if git push origin main; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push failed, rebasing..."
            git pull --rebase origin main || true
            sleep $((attempt * 3))
          done

          echo "::error::Push failed after 3 attempts"
          exit 1
