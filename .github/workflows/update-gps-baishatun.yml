name: Update GPS Position Baishatun

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-gas:
    runs-on: ubuntu-latest
    steps:
      - name: Call GAS cronPush
        env:
          WEB_APP_SECRET: ${{ secrets.WEB_APP_SECRET }}
        run: |
          set -euo pipefail
          URL="https://script.google.com/macros/s/AKfycbxJAlXwKv8tUgc9DQEpSDxPSLHI0Gl8deFqiDgbCoYHzz-xIKDAd8g0n8G5pGMErrq9pg/exec?action=cronPush&key=${WEB_APP_SECRET}"
          for i in 1 2 3; do
            HTTP_CODE=$(curl -sSL --max-time 20 -o /tmp/resp.json -w '%{http_code}' "$URL" || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] && head -c 1 /tmp/resp.json | grep -q '{'; then
              break
            fi
            sleep $((i * 5))
          done
          if [ ! -s /tmp/resp.json ]; then echo "::error::Empty response"; exit 1; fi
          if grep -qi '<html' /tmp/resp.json; then echo "::error::GAS returned HTML"; exit 1; fi
          STATUS=$(jq -r '.status // "unknown"' /tmp/resp.json)
          echo "GAS status: $STATUS"
          case "$STATUS" in
            success|skipped) ;;
            *) echo "::error::Unexpected status: $STATUS"; cat /tmp/resp.json; exit 1 ;;
          esac
