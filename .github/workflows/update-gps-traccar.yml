name: Update GPS Position (Traccar)

on:
  schedule:
    - cron: '0 0 * * *'   # GitHub-side fallback, every 6 hours
  workflow_dispatch:         # primary trigger (cron-job.org)

permissions:
  contents: write

concurrency:
  group: mazu-gps-traccar
  cancel-in-progress: false

jobs:
  update-gps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch position from GAS
        id: fetch
        env:
          WEB_APP_SECRET: ${{ secrets.WEB_APP_SECRET }}
        run: |
          set -euo pipefail

          URL="https://script.google.com/macros/s/AKfycby-y7JYE7NISiInymVH1kbL9lYYtreNv3qRdoVvRcysUeyEoB8aVgrrKS9BsbA2Yw2V/exec?action=cronPush&key=${WEB_APP_SECRET}"

          for i in 1 2 3; do
            echo "Attempt $i..."
            HTTP_CODE=$(curl -sSL --max-time 20 -o /tmp/resp.json -w '%{http_code}' "$URL" || echo "000")
            echo "HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] && head -c 1 /tmp/resp.json | grep -q '{'; then
              break
            fi
            sleep $((i * 5))
          done

          if [ ! -s /tmp/resp.json ]; then
            echo "::error::Empty response from GAS"
            exit 1
          fi
          if grep -qi '<html' /tmp/resp.json; then
            echo "::error::GAS returned HTML (deployment access misconfigured?)"
            exit 1
          fi
          if ! jq -e . /tmp/resp.json > /dev/null 2>&1; then
            echo "::error::Response is not valid JSON"
            head -c 500 /tmp/resp.json
            exit 1
          fi

          STATUS=$(jq -r '.status // "unknown"' /tmp/resp.json)
          echo "GAS status: $STATUS"

          case "$STATUS" in
            success)
              ;;
            skipped)
              echo "Position unchanged per GAS; skipping commit."
              echo "do_commit=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            forbidden)
              echo "::error::GAS rejected the request (missing/wrong WEB_APP_SECRET?)"
              exit 1
              ;;
            error)
              MSG=$(jq -r '.message // "unknown error"' /tmp/resp.json)
              echo "::warning::GAS error: $MSG (CDN left untouched)"
              echo "do_commit=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "::error::Unexpected status: $STATUS"
              cat /tmp/resp.json
              exit 1
              ;;
          esac

          mkdir -p web/data
          mv /tmp/resp.json web/data/position-traccar.json

          # Signature: strip volatile fields (updateTime, fixTime, address,
          # heading, speed, status, lastUpdate, parkedSince) so the gate fires
          # only on real lat/lng movement.
          jq '{
            status,
            devices: (
              if (.devices | type) == "array" then
                [ .devices[] | {name, lat, lng} ] | sort_by(.name)
              else null end
            )
          }' web/data/position-traccar.json > /tmp/pos-signature.json

          NEW_SIG=$(sha256sum /tmp/pos-signature.json | awk '{print $1}')
          OLD_SIG=""
          if [ -f web/data/.pos-signature-traccar.json ]; then
            OLD_SIG=$(sha256sum web/data/.pos-signature-traccar.json | awk '{print $1}')
          fi

          if [ "$NEW_SIG" = "$OLD_SIG" ]; then
            echo "Position signature unchanged ($NEW_SIG); skipping commit."
            echo "do_commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Position changed; will commit."
          cp /tmp/pos-signature.json web/data/.pos-signature-traccar.json

          # Strip the internal .github sub-object if present. Keep devices,
          # updateTime, parkedSince, status, etc. so the frontend keeps working.
          jq 'del(.github)' web/data/position-traccar.json > /tmp/full-payload.json
          mv /tmp/full-payload.json web/data/position-traccar.json

          echo "do_commit=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.fetch.outputs.do_commit == 'true'
        run: |
          set -euo pipefail

          cp web/data/position-traccar.json         /tmp/keep-position.json
          cp web/data/.pos-signature-traccar.json   /tmp/keep-signature.json

          for attempt in 1 2 3; do
            echo "===== Push attempt $attempt ====="

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/keep-position.json  web/data/position-traccar.json
            cp /tmp/keep-signature.json web/data/.pos-signature-traccar.json

            git add web/data/position-traccar.json web/data/.pos-signature-traccar.json
            if git diff --cached --quiet; then
              echo "Nothing to commit after reset (remote already has our state)."
              exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update GPS position [skip ci]"

            if git push origin main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi

            echo "Push rejected; will rebuild from remote HEAD and retry."
            sleep $((attempt * 3))
          done

          echo "::error::Push failed after 3 attempts"
          exit 1
